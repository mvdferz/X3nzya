<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telegram NFT Gifts</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#0e0e13;--card:#17171f;--card2:#1f1f2e;--border:rgba(255,255,255,0.06);--text:#ffffff;--muted:#6b7280;--accent:#5b5ef5;--accent2:#c084fc;--gold:#f5c842;--green:#22c55e;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 70% 50% at 15% 0%,rgba(91,94,245,.13) 0%,transparent 55%),radial-gradient(ellipse 60% 40% at 85% 100%,rgba(192,132,252,.09) 0%,transparent 55%);}
.wrap{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:0 14px 90px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;}
.header-title{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.header-title span{background:linear-gradient(135deg,#5b5ef5,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stars-badge{display:flex;align-items:center;gap:5px;background:rgba(245,200,66,.12);border:1px solid rgba(245,200,66,.25);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--gold);}
.tabs{display:flex;gap:3px;background:var(--card);border-radius:14px;padding:4px;margin-bottom:18px;}
.tab{flex:1;padding:9px 4px;border-radius:10px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;}
.tab.active{background:var(--card2);color:var(--text);}
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap input{width:100%;padding:11px 14px 11px 40px;background:var(--card);border:1px solid var(--border);border-radius:13px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;}
.search-wrap input:focus{border-color:rgba(91,94,245,.4);}
.search-wrap input::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
.gift-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px 12px 12px;cursor:pointer;position:relative;overflow:hidden;transition:transform .18s;}
.gift-card:active{transform:scale(0.95);}
.gift-card::before{content:'';position:absolute;inset:0;border-radius:20px;background:var(--cg);opacity:.09;pointer-events:none;}
.rarity-badge{position:absolute;top:9px;left:9px;font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 7px;border-radius:20px;}
.rarity-badge.common{background:rgba(107,114,128,.3);color:#9ca3af;}
.rarity-badge.rare{background:rgba(59,130,246,.25);color:#60a5fa;}
.rarity-badge.epic{background:rgba(167,139,250,.25);color:#a78bfa;}
.rarity-badge.legendary{background:rgba(245,200,66,.2);color:var(--gold);}
.rarity-badge.author{background:rgba(34,197,94,.2);color:#4ade80;}
.owned-badge{position:absolute;top:9px;right:9px;background:rgba(34,197,94,.2);color:#4ade80;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;display:none;}
.gift-visual{width:88px;height:88px;border-radius:50%;margin:18px auto 12px;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--cg);box-shadow:0 6px 24px rgba(0,0,0,.35);position:relative;animation:floatY 3.5s ease-in-out infinite;}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.gift-name{font-size:13px;font-weight:700;text-align:center;margin-bottom:3px;line-height:1.3;}
.gift-info{font-size:11px;color:var(--muted);text-align:center;margin-bottom:9px;}
.gift-price{display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:800;color:var(--gold);margin-bottom:9px;}
.btn-buy{width:100%;padding:9px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),#4338ca);color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:inherit;}
.btn-buy:active{opacity:.75;}
.btn-buy.owned-btn{background:linear-gradient(135deg,#059669,#047857);}
.my-list{display:flex;flex-direction:column;gap:10px;}
.my-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .18s;position:relative;overflow:hidden;}
.my-card:active{transform:scale(0.97);}
.my-card::before{content:'';position:absolute;inset:0;background:var(--cg);opacity:.07;pointer-events:none;}
.my-card-emo{width:62px;height:62px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--cg);box-shadow:0 4px 16px rgba(0,0,0,.3);position:relative;animation:floatY 3s ease-in-out infinite;}
.my-card-body{flex:1;min-width:0;}
.my-card-name{font-size:14px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.my-card-lv{font-size:11px;color:var(--muted);margin-bottom:6px;}
.progress-bg{height:3px;background:var(--card2);border-radius:3px;overflow:hidden;margin-bottom:5px;}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s;}
.stars-row{display:flex;gap:2px;}
.star{font-size:11px;opacity:.2;transition:opacity .3s,transform .3s;}
.star.on{opacity:1;transform:scale(1.15);}
.btn-up{flex-shrink:0;padding:10px 14px;border-radius:13px;border:none;background:linear-gradient(135deg,var(--gold),#d97706);color:#1a0f00;font-size:11px;font-weight:800;cursor:pointer;transition:opacity .15s;font-family:inherit;text-align:center;line-height:1.3;}
.btn-up:active{opacity:.8;}
.btn-up:disabled{background:var(--card2);color:var(--muted);cursor:default;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:28px 28px 0 0;padding:8px 22px 50px;width:100%;max-width:430px;transform:translateY(110%);transition:transform .4s cubic-bezier(.34,1.4,.64,1);}
.overlay.open .modal{transform:translateY(0);}
.modal-drag{width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:4px;margin:10px auto 20px;}
.modal-hero{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:58px;position:relative;}
@keyframes glowPulse{0%,100%{box-shadow:0 0 25px var(--gc,#5b5ef5);}50%{box-shadow:0 0 55px var(--gc,#5b5ef5),0 0 100px var(--gc,#c084fc)33;}}
.modal-hero{animation:floatY 2.5s ease-in-out infinite,glowPulse 2.5s ease-in-out infinite;}
.modal-rarity{text-align:center;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
.modal-name{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px;}
.lv-dots{display:flex;gap:8px;justify-content:center;margin-bottom:18px;}
.lv-dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .3s;}
.lv-dot.done{border-color:var(--accent);background:rgba(91,94,245,.15);}
.lv-dot.current{border-color:var(--gold);background:rgba(245,200,66,.15);animation:dotPulse 1.5s infinite;}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,200,66,.4);}50%{box-shadow:0 0 0 6px rgba(245,200,66,0);}}
.info-row{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
.info-swatch{width:42px;height:42px;border-radius:10px;flex-shrink:0;}
.info-label{font-size:11px;color:var(--muted);margin-bottom:2px;}
.info-val{font-size:14px;font-weight:700;}
.cost-row{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
.cost-lbl{font-size:13px;color:var(--muted);}
.cost-val{font-size:20px;font-weight:800;color:var(--gold);}
.btn-main{width:100%;padding:17px;border-radius:17px;border:none;background:linear-gradient(135deg,var(--accent),#4338ca);color:#fff;font-size:16px;font-weight:800;cursor:pointer;transition:opacity .15s,transform .1s;font-family:inherit;letter-spacing:-.2px;}
.btn-main.gold{background:linear-gradient(135deg,var(--gold),#d97706);color:#1a0f00;}
.btn-main:active{opacity:.85;transform:scale(0.98);}
.btn-main:disabled{background:var(--card2);color:var(--muted);cursor:default;transform:none;}
.btn-cancel{width:100%;padding:13px;border-radius:14px;border:1px solid var(--border);background:none;color:var(--muted);font-size:14px;cursor:pointer;margin-top:9px;font-family:inherit;}
.particle{position:absolute;width:7px;height:7px;border-radius:50%;top:50%;left:50%;pointer-events:none;animation:particleFly .75s ease-out forwards;}
@keyframes particleFly{0%{opacity:1;transform:translate(-50%,-50%) scale(1.2);}100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(0);}}
.toast{position:fixed;bottom:100px;left:50%;z-index:300;transform:translateX(-50%) translateY(16px);background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:12px 22px;font-size:14px;font-weight:600;white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:rgba(34,197,94,.35);color:var(--green);}
.toast.err{border-color:rgba(239,68,68,.35);color:var(--red);}
.empty{text-align:center;padding:60px 0;color:var(--muted);}
.empty div:first-child{font-size:52px;margin-bottom:12px;opacity:.5;}
.empty p{font-size:15px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-title">🎁 <span>NFT Gifts</span></div>
    <div class="stars-badge">⭐ <span id="bal">1 000</span></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('shop')">🛍 Магазин</button>
    <button class="tab" onclick="switchTab('my')">🎀 Мои</button>
    <button class="tab" onclick="switchTab('top')">🏆 Редкие</button>
    <button class="tab" onclick="switchTab('auth')">⭐ Авторы</button>
  </div>
  <div id="tab-shop">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Поиск подарка…" oninput="filterGifts(this.value)">
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Все</button>
      <button class="filter-btn" onclick="setFilter('common',this)">Common</button>
      <button class="filter-btn" onclick="setFilter('rare',this)">Rare</button>
      <button class="filter-btn" onclick="setFilter('epic',this)">Epic</button>
      <button class="filter-btn" onclick="setFilter('legendary',this)">Legendary</button>
    </div>
    <div class="grid" id="shop-grid"></div>
  </div>
  <div id="tab-my" style="display:none"><div class="my-list" id="my-list"></div></div>
  <div id="tab-top" style="display:none"><div class="grid" id="top-grid"></div></div>
  <div id="tab-auth" style="display:none"><div class="grid" id="auth-grid"></div></div>
</div>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-hero" id="mhero"></div>
    <div class="modal-rarity" id="mrarity"></div>
    <div class="modal-name" id="mname"></div>
    <div class="modal-sub" id="msub"></div>
    <div class="lv-dots" id="mdots"></div>
    <div class="info-row">
      <div class="info-swatch" id="mswatch"></div>
      <div><div class="info-label">Фон подарка</div><div class="info-val" id="mbgname"></div></div>
    </div>
    <div class="cost-row">
      <span class="cost-lbl" id="mclbl">Стоимость</span>
      <span class="cost-val" id="mcost"></span>
    </div>
    <button class="btn-main" id="mbtn" onclick="doAction()"></button>
    <button class="btn-cancel" onclick="closeOverlay()">Отмена</button>
  </div>
</div>

<div class="toast" id="toast"></div>

const AUTHORS=[
  {id:'snoop_dogg',name:'Snoop Dogg',emoji:'🎤',supply:595358,price:50,rarity:'author',bg:'Pacific Cyan',author:'@snoopdogg',desc:'Коллекционный Snoop Dogg'},
  {id:'swag_bag',name:'Swag Bag',emoji:'🛍️',supply:239091,price:30,rarity:'author',bg:'Pacific Cyan',author:'@snoopdogg',desc:'Сумка со свэгом'},
  {id:'snoop_cigar',name:'Snoop Cigar',emoji:'🚬',supply:119806,price:60,rarity:'author',bg:'Gunmetal',author:'@snoopdogg',desc:'Сигара Snoop'},
  {id:'low_rider',name:'Low Rider',emoji:'🚗',supply:23991,price:200,rarity:'author',bg:'Cobalt Blue',author:'@snoopdogg',desc:'Лоурайдер'},
  {id:'westside_sign',name:'Westside Sign',emoji:'🤙',supply:11995,price:400,rarity:'author',bg:'Old Gold',author:'@snoopdogg',desc:'Знак West Side — ультраредкий!'},
  {id:'khabib_papakha',name:"Khabib's Papakha",emoji:'🧢',supply:29000,price:150,rarity:'author',bg:'Emerald',author:'@khabib_nurmagomedov',desc:'Папаха Хабиба'},
  {id:'ufc_strike',name:'UFC Strike',emoji:'🥊',supply:60000,price:80,rarity:'author',bg:'Carmine',author:'@ufc',desc:'Удар UFC'},
];

// STATE
let balance=1000, myGifts=[], modalState=null, activeTab='shop', shopFilter='all', searchQ='';

const UP_COST=[0,50,120,300,800,2000];
const UP_BG=['','Neon Blue','Electric Indigo','Electric Purple','French Violet','Pure Gold'];
const RARITY_ORDER=['legendary','epic','rare','common','author'];
const RARITY_COL={legendary:'#f5c842',epic:'#a78bfa',rare:'#60a5fa',common:'#9ca3af',author:'#4ade80'};
const LV_EMO=['🎁','⭐','⭐⭐','🌟🌟🌟','✨✨✨✨','🔥🔥🔥🔥🔥'];
const LV_LBL=['Базовый','Улучшен I','Улучшен II','Улучшен III','Элитный','ЛЕГЕНДАРНЫЙ 👑'];

function fmtN(n){return Number(n).toLocaleString('ru');}
function updBal(){document.getElementById('bal').textContent=fmtN(balance);}

function effBg(gift,lv){return lv===0?gift.bg:(UP_BG[lv]||gift.bg);}

function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast show ${type}`;
  clearTimeout(el._t); el._t=setTimeout(()=>el.className='toast',2800);
}

function isOwned(id){return myGifts.some(m=>m.giftId===id);}
function allGifts(){return[...GIFTS,...AUTHORS];}

// ── RENDER CARDS ──
function giftCard(g,src){
  const bg=grad(g.bg),c=BG[g.bg]||['#7c6af5','#5b4fd4'];
  const col=RARITY_COL[g.rarity]||'#9ca3af';
  const owned=isOwned(g.id);
  const authorLine=g.author?`<div style="font-size:10px;color:#4ade80;text-align:center;margin-bottom:3px">${g.author}</div>`:'';
  return `<div class="gift-card" style="--cg:${bg}" onclick="openBuy('${g.id}')">
    <div class="rarity-badge ${g.rarity}" style="color:${col}">${cap(g.rarity)}</div>
    ${owned?'<div class="owned-badge" style="display:block">Есть</div>':''}
    <div class="gift-visual" style="background:${bg};box-shadow:0 6px 24px ${c[0]}55">${g.emoji}</div>
    <div class="gift-name">${g.name}</div>
    ${authorLine}
    <div class="gift-info">${fmtN(g.supply)} шт.</div>
    <div class="gift-price">⭐ ${g.price}</div>
    <button class="btn-buy ${owned?'owned-btn':''}" onclick="event.stopPropagation();quickBuy('${g.id}')">
      ${owned?'Купить ещё':'Купить'}
    </button>
  </div>`;
}

function renderShop(){
  let list=[...GIFTS];
  if(shopFilter!=='all') list=list.filter(g=>g.rarity===shopFilter);
  if(searchQ) list=list.filter(g=>g.name.toLowerCase().includes(searchQ));
  list.sort((a,b)=>RARITY_ORDER.indexOf(a.rarity)-RARITY_ORDER.indexOf(b.rarity));
  document.getElementById('shop-grid').innerHTML=list.map(g=>giftCard(g,'shop')).join('');
}

function renderTop(){
  const list=[...GIFTS].filter(g=>['legendary','epic'].includes(g.rarity)).sort((a,b)=>a.supply-b.supply);
  document.getElementById('top-grid').innerHTML=list.map(g=>giftCard(g,'top')).join('');
}

function renderAuth(){
  document.getElementById('auth-grid').innerHTML=AUTHORS.map(g=>giftCard(g,'auth')).join('');
}

function renderMy(){
  const el=document.getElementById('my-list');
  if(!myGifts.length){
    el.innerHTML='<div class="empty"><div>🎁</div><p>У вас пока нет подарков.<br>Купите в магазине!</p></div>';
    return;
  }
  el.innerHTML=myGifts.map((mg,idx)=>{
    const gift=allGifts().find(g=>g.id===mg.giftId); if(!gift) return '';
    const lv=mg.level, bgn=effBg(gift,lv), bg=grad(bgn), c=BG[bgn]||['#7c6af5','#5b4fd4'];
    const maxed=lv>=5, nxt=maxed?0:UP_COST[lv+1], canUp=!maxed&&balance>=nxt;
    const stars=Array.from({length:5},(_,i)=>`<span class="star ${i<lv?'on':''}">⭐</span>`).join('');
    return `<div class="my-card" style="--cg:${bg}" onclick="openUpgrade(${idx})">
      <div class="my-card-emo" style="background:${bg};box-shadow:0 4px 20px ${c[0]}55">
        ${gift.emoji}${lv>=3?'<span style="position:absolute;font-size:12px;top:0;right:0">✨</span>':''}
      </div>
      <div class="my-card-body">
        <div class="my-card-name">${gift.name}</div>
        <div class="my-card-lv">${LV_LBL[lv]} · Ур.${lv}/5</div>
        <div class="progress-bg"><div class="progress-fill" style="width:${lv/5*100}%"></div></div>
        <div class="stars-row">${stars}</div>
      </div>
      <button class="btn-up" onclick="event.stopPropagation();quickUpgrade(${idx})" ${maxed?'disabled':''}>
        ${maxed?'👑 MAX':`⬆ ${nxt}⭐`}
      </button>
    </div>`;
  }).join('');
}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

// ── TABS ──
function switchTab(tab){
  activeTab=tab;
  ['shop','my','top','auth'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===tab?'':'none';
  });
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active',['shop','my','top','auth'][i]===tab);
  });
  if(tab==='my') renderMy();
  if(tab==='top') renderTop();
  if(tab==='auth') renderAuth();
}

// ── FILTER ──
function setFilter(f,btn){
  shopFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); renderShop();
}
function filterGifts(q){searchQ=q.toLowerCase(); renderShop();}

// ── MODAL ──
function openBuy(giftId){
  const gift=allGifts().find(g=>g.id===giftId); if(!gift) return;
  modalState={type:'buy',gift};
  const bg=grad(gift.bg),c=BG[gift.bg]||['#7c6af5','#5b4fd4'];
  const hero=document.getElementById('mhero');
  hero.style.background=bg; hero.style.setProperty('--gc',c[0]+'aa');
  hero.innerHTML=`<span style="font-size:58px">${gift.emoji}</span>`;
  document.getElementById('mrarity').textContent=cap(gift.rarity);
  document.getElementById('mrarity').style.color=RARITY_COL[gift.rarity]||'#4ade80';
  document.getElementById('mname').textContent=gift.name;
  document.getElementById('msub').textContent=`${fmtN(gift.supply)} шт. · ${gift.desc}`;
  // lv dots
  document.getElementById('mdots').innerHTML=Array.from({length:6},(_,i)=>{
    return `<div class="lv-dot ${i===0?'current':''}">${LV_EMO[i]||i}</div>`;
  }).join('');
  // bg info
  const swatch=document.getElementById('mswatch');
  swatch.style.background=bg;
  document.getElementById('mbgname').textContent=gift.bg;
  document.getElementById('mclbl').textContent='Стоимость';
  document.getElementById('mcost').textContent=`⭐ ${gift.price}`;
  const btn=document.getElementById('mbtn');
  btn.textContent='🛍 Купить подарок'; btn.className='btn-main'; btn.disabled=balance<gift.price;
  document.getElementById('overlay').classList.add('open');
}

function openUpgrade(idx){
  const mg=myGifts[idx];
  const gift=allGifts().find(g=>g.id===mg.giftId); if(!gift) return;
  modalState={type:'upgrade',gift,myIdx:idx};
  const lv=mg.level, maxed=lv>=5, nlv=Math.min(lv+1,5);
  const bgn=effBg(gift,lv), bg=grad(bgn), c=BG[bgn]||['#7c6af5','#5b4fd4'];
  const hero=document.getElementById('mhero');
  hero.style.background=bg; hero.style.setProperty('--gc',c[0]+'aa');
  hero.innerHTML=`<span style="font-size:58px">${gift.emoji}${lv>=3?'✨':''}</span>`;
  document.getElementById('mrarity').textContent=LV_LBL[lv];
  document.getElementById('mrarity').style.color=maxed?'#f5c842':'#a78bfa';
  document.getElementById('mname').textContent=gift.name;
  document.getElementById('msub').textContent=maxed?'Максимальный уровень!':`Текущий уровень: ${lv}/5`;
  document.getElementById('mdots').innerHTML=Array.from({length:6},(_,i)=>{
    let cls=i<lv?'done':(i===lv?'current':'');
    return `<div class="lv-dot ${cls}">${LV_EMO[i]||i}</div>`;
  }).join('');
  const nextBg=grad(maxed?bgn:effBg(gift,nlv));
  const nextBgN=maxed?bgn:effBg(gift,nlv);
  document.getElementById('mswatch').style.background=nextBg;
  document.getElementById('mbgname').textContent=maxed?'Максимум достигнут':nextBgN+' (после улучшения)';
  const cost=maxed?0:UP_COST[nlv];
  document.getElementById('mclbl').textContent=maxed?'Статус':'Стоимость улучшения';
  document.getElementById('mcost').textContent=maxed?'👑 MAX':`⭐ ${cost}`;
  const btn=document.getElementById('mbtn');
  btn.className='btn-main gold';
  btn.textContent=maxed?'👑 Максимальный уровень':`✨ Улучшить → Уровень ${nlv}`;
  btn.disabled=maxed||balance<cost;
  document.getElementById('overlay').classList.add('open');
}

function closeOverlay(){document.getElementById('overlay').classList.remove('open'); modalState=null;}
function overlayClick(e){if(e.target===document.getElementById('overlay')) closeOverlay();}

function doAction(){
  if(!modalState) return;
  if(modalState.type==='buy') doBuy(modalState.gift.id);
  else doUpgrade(modalState.myIdx);
  closeOverlay();
}

// ── BUY / UPGRADE ──
function doBuy(giftId){
  const gift=allGifts().find(g=>g.id===giftId); if(!gift) return;
  if(balance<gift.price){toast('Недостаточно звёзд ⭐','err'); return;}
  balance-=gift.price; updBal();
  myGifts.unshift({uid:Date.now(),giftId:gift.id,level:0});
  toast(`✅ Куплен: ${gift.name}!`);
  sendData('bought',gift.name,0);
  renderShop(); renderTop(); renderAuth();
}

function quickBuy(giftId){doBuy(giftId);}

function doUpgrade(idx){
  const mg=myGifts[idx];
  const gift=allGifts().find(g=>g.id===mg.giftId);
  if(!gift||mg.level>=5) return;
  const cost=UP_COST[mg.level+1];
  if(balance<cost){toast('Недостаточно звёзд ⭐','err'); return;}
  balance-=cost; updBal(); mg.level++;
  toast(`✨ ${gift.name} → Уровень ${mg.level}!${mg.level===5?' 👑 МАКСИМУМ!':''}`);
  sendData('upgraded',gift.name,mg.level);
  burst(); renderMy();
}

function quickUpgrade(idx){doUpgrade(idx);}

// ── PARTICLES ──
function burst(){
  const wrap=document.getElementById('mhero');
  if(!wrap) return;
  const cols=['#f5c842','#a78bfa','#c084fc','#22c55e','#f97316','#60a5fa'];
  for(let i=0;i<14;i++){
    const p=document.createElement('div'); p.className='particle';
    const a=(i/14)*Math.PI*2, d=55+Math.random()*50;
    p.style.background=cols[i%cols.length];
    p.style.setProperty('--tx',Math.cos(a)*d+'px');
    p.style.setProperty('--ty',Math.sin(a)*d+'px');
    p.style.animationDelay=Math.random()*.15+'s';
    wrap.appendChild(p); setTimeout(()=>p.remove(),900);
  }
}

// ── TELEGRAM ──
function sendData(action,gift,level){
  try{window.Telegram?.WebApp?.sendData(JSON.stringify({action,gift,level}));}catch(e){}
}

function initTg(){
  if(window.Telegram?.WebApp){
    Telegram.WebApp.ready(); Telegram.WebApp.expand();
    const p=new URLSearchParams(location.search);
    const t=p.get('tab');
    if(t&&['shop','my','top','auth'].includes(t)) switchTab(t);
  }
}

// ── INIT ──
updBal(); renderShop(); initTg();
</script>
